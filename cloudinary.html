<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudinary — MyTrailWalks</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <style>
    .cloudinary-page{max-width:760px;margin:32px auto;padding:0 20px 48px}
    .cloudinary-card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:22px}
    .cloudinary-field{margin-bottom:16px}
    .cloudinary-field input{width:100%;box-sizing:border-box;padding:9px}
    .cloudinary-actions{display:flex;gap:10px}
  </style>
</head>
<body>
  <div id="topbar-placeholder" aria-hidden="true"></div>

  <main class="cloudinary-page" id="cloudinary-main" hidden>
    <section class="cloudinary-card">
      <h1>Cloudinary configuratie</h1>
      <p>Deze instellingen worden gekoppeld aan je ingelogde MyTrailWalks-account.</p>

      <div class="cloudinary-field">
        <label for="cloudinary-cloud-name">Cloud name</label>
        <input id="cloudinary-cloud-name" type="text" autocomplete="off">
      </div>

      <div class="cloudinary-field">
        <label for="cloudinary-upload-preset">Unsigned upload preset</label>
        <input id="cloudinary-upload-preset" type="text" autocomplete="off">
      </div>

      <div class="cloudinary-actions">
        <button id="cloudinary-save" type="button">Opslaan</button>
        <button id="cloudinary-remove" type="button">Koppeling verwijderen</button>
      </div>

      <p id="cloudinary-message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <div id="footer-placeholder" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/topbar-auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloudinary.js"></script>
</body>
</html>
