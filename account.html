<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mijn Account — MyTrailWalks</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/footer.css">
  <style>
    .account-page{max-width:820px;margin:32px auto;padding:0 20px 48px}
    .account-card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:20px;margin:0 0 20px}
    .account-card input{width:100%;max-width:420px;box-sizing:border-box;padding:9px;margin:5px 0 12px}
    .account-card button{padding:9px 14px;cursor:pointer}
    .account-status{min-height:1.2em}
  </style>
</head>
<body>
  <div id="topbar-placeholder" aria-hidden="true"></div>

  <main class="account-page" id="account-main" hidden>
    <h1>Mijn Account</h1>

    <section class="account-card" id="profile">
      <h2>Profiel</h2>
      <p><strong>E-mail:</strong> <span id="account-email"></span></p>
      <label for="account-username">Naam</label><br>
      <input id="account-username" type="text" autocomplete="nickname">
      <br><button id="account-profile-save" type="button">Profiel opslaan</button>
      <p class="account-status" id="account-profile-status"></p>
    </section>

    <section class="account-card">
      <h2>Cloudinary configuratie</h2>
      <p><a href="/MyTrailWalks/cloudinary.html">Cloudinary configuratie openen</a></p>
    </section>

    <section class="account-card" id="password">
      <h2>Wachtwoord wijzigen</h2>
      <label for="account-password">Nieuw wachtwoord</label><br>
      <input id="account-password" type="password" autocomplete="new-password">
      <br><label for="account-password-confirm">Bevestig wachtwoord</label><br>
      <input id="account-password-confirm" type="password" autocomplete="new-password">
      <br><button id="account-password-save" type="button">Wachtwoord wijzigen</button>
      <p class="account-status" id="account-password-status"></p>
    </section>

    <section class="account-card" id="delete-account">
      <h2>Account verwijderen</h2>
      <p>Definitieve accountverwijdering vereist een beveiligde Supabase serverfunctie.</p>
      <button id="account-delete" type="button">Account verwijderen</button>
      <p class="account-status" id="account-delete-status"></p>
    </section>
  </main>

  <div id="footer-placeholder" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/topbar-auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
